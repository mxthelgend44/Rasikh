# Rasikh Guard workspace.
#
# `vendor/` holds an unmodified copy of three OpenAPPA crates (MIT, see LICENSE.md and
# UPSTREAM.md). Workspace-level settings below mirror the upstream root Cargo.toml so the
# vendored crates build and test exactly as they do upstream.

[workspace]
resolver = "3"
members = [
    "vendor/appa-runtime-api",
    "vendor/appa-engine",
    "vendor/appa-policy",
]

[workspace.package]
edition = "2024"
publish = false
version = "0.30.0"

[workspace.lints.rust]
dead_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
thiserror = "2"
toml = "1"
tracing = "0.1"
appa-engine = { path = "vendor/appa-engine" }
appa-policy = { path = "vendor/appa-policy" }
appa-runtime-api = { path = "vendor/appa-runtime-api" }

[profile.release]
debug-assertions = false
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.release.package.appa-engine]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
